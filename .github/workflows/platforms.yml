name: Other platform builds
on:
  pull_request:
    branches: [develop, Master]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run check
      - if: runner.os == 'macOS'
        run: npm run check
      - if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never --config.mac.identity=- --config.mac.notarize=false --config.mac.hardenedRuntime=false
      - if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never
      - run: npm run release:manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Compositor-${{ runner.os }}-local-build
          path: release/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:sync
      - run: bash clients/android/gradlew -p clients/android assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Compositor-Android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -project clients/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath clients/ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Compositor-iOS-simulator
          path: clients/ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
