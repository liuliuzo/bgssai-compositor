<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BGSSAI Compositor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121518;
      --panel: #1b2026;
      --border: #2d353f;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --accent: #2f81f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1, h2, h3 { margin: 0 0 10px 0; font-weight: 600; }
    header h1 { margin: 0; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      padding: 20px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: var(--text);
      font-size: 13px;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      margin-top: 8px;
    }
    button.secondary {
      background: transparent;
      border-color: var(--border);
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .status-box {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #0d1117;
      font-family: Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>BGSSAI Compositor</h1>
    <div id="session-badge">本地工作空间</div>
  </header>
  <main>
    <section aria-label="文档与图层">
      <h2>文档与图层</h2>
      <div class="row">
        <button id="btn-new-doc" type="button">新建画布</button>
        <button id="btn-open-doc" class="secondary" type="button">打开项目</button>
        <button id="btn-save-doc" class="secondary" type="button">保存项目</button>
      </div>
      <div id="doc-output" class="status-box">未命名.bgcomp · 1600 × 1000 px · RGB / 8 位 · 图层：3</div>
    </section>

    <section aria-label="账户与连接">
      <h2>账户与连接</h2>
      <label>
        登录方式
        <select id="auth-channel">
          <option value="local_password">本地账号密码登录 / 注册</option>
          <option value="verification_code">手机 / 邮箱验证码登录</option>
          <option value="chat">BGSSAI Chat 授权登录</option>
          <option value="wechat">微信扫码登录</option>
          <option value="douyin">抖音账号登录</option>
          <option value="baidu">百度账号登录</option>
          <option value="alipay">支付宝快捷登录</option>
        </select>
      </label>
      <div class="row">
        <label style="flex: 0 0 140px;">
          区号
          <select id="auth-dial">
            <option value="+86" selected>CN +86</option>
            <option value="+852">HK +852</option>
            <option value="+65">SG +65</option>
            <option value="+81">JP +81</option>
            <option value="+1">US +1</option>
          </select>
        </label>
        <label style="flex: 1;">
          账号（手机号 / 邮箱 / 用户名）
          <input id="auth-identifier" value="13800138000" />
        </label>
      </div>
      <div class="row">
        <label style="flex: 1;">
          密码 / 验证码
          <input id="auth-secret" type="password" />
        </label>
        <button id="btn-send-otp" class="secondary" type="button" style="flex: 0 0 132px; align-self: flex-end; margin-bottom: 8px;">发送验证码</button>
      </div>
      <div class="row">
        <button id="btn-login" type="button">登录</button>
        <button id="btn-logout" class="secondary" type="button">退出</button>
      </div>
      <div id="auth-output" class="status-box">未登录</div>
    </section>

    <section aria-label="额度套餐">
      <h2>额度套餐</h2>
      <p>当前套餐：专业版 · 剩余额度：<strong title="418,912,345">418.9M</strong></p>
      <div class="row">
        <button id="btn-quota" type="button">刷新额度明细</button>
      </div>
      <div id="quota-output" class="status-box">就绪</div>
    </section>

    <section aria-label="AI 图层与设计建议">
      <h2>AI 图层与设计建议</h2>
      <label>
        AI 模型（0.5x / 1x / 1.5x）
        <select id="ai-model">
          <option value="bgssai-chat" data-multiplier="0.5x">BGSSAI Chat · 0.5x</option>
          <option value="qwen-plus" data-multiplier="1x">Qwen Plus · 1x</option>
          <option value="bgssai-pro" data-multiplier="1.5x">BGSSAI Pro · 1.5x</option>
        </select>
      </label>
      <label>
        提示词
        <textarea id="ai-prompt" rows="2">海山日落海报主标题</textarea>
      </label>
      <button id="btn-ai" type="button">生成 AI 设计建议</button>
      <div id="ai-output" class="status-box">就绪</div>
    </section>

    <section aria-label="在线客服与技术支持">
      <h2>在线客服与技术支持</h2>
      <label>
        咨询或工单主题
        <input id="support-subject" value="导出 PNG 透明通道问题" />
      </label>
      <label>
        咨询消息内容
        <textarea id="support-message" rows="2">半透明阴影图层导出问题反馈</textarea>
      </label>
      <div class="row">
        <button id="btn-support-create" type="button">提交客服工单</button>
        <button id="btn-support-webhook" class="secondary" type="button">刷新工单状态</button>
      </div>
      <div id="support-output" class="status-box">就绪</div>
    </section>

    <section aria-label="BGSSAI Bot 协同编辑">
      <h2>BGSSAI Bot 协同编辑</h2>
      <label>
        协同动作
        <select id="mcp-action">
          <option value="create_project">新建项目</option>
          <option value="add_text_layer">新增文字图层</option>
          <option value="add_shape_layer">新增形状图层</option>
          <option value="transform_layer">图层变换</option>
          <option value="adjust_filter">颜色与滤镜</option>
          <option value="export_asset">导出图像</option>
          <option value="preview_destructive_edit">预览变更</option>
          <option value="confirm_destructive_edit">应用变更</option>
          <option value="undo">撤销</option>
        </select>
      </label>
      <button id="btn-mcp-run" type="button">执行</button>
      <div id="mcp-output" class="status-box">就绪</div>
    </section>

    <section aria-label="导入转换报告">
      <h2>导入转换报告</h2>
      <div id="psd-report" class="status-box">poster.psd · PSD · 1600×1000
状态：部分可编辑
保留：像素图层 Spot、用户蒙版、文字图层
损失：附加通道 3、附加通道 -3</div>
    </section>
  </main>
  <script>
    const state = {
      session: null,
      tickets: [],
      processedEvents: new Set(),
      previewId: null,
      historyDepth: 1
    };

    document.getElementById("btn-quota")?.addEventListener("click", () => {
      document.getElementById("quota-output").textContent = JSON.stringify({
        package_name: "专业版",
        remaining_tokens: 418912345,
        display: "418.9M",
        exact: "418,912,345"
      }, null, 2);
    });

    let otpCooldown = 0;
    document.getElementById("btn-send-otp")?.addEventListener("click", () => {
      if (otpCooldown > 0) return;
      const dial = document.getElementById("auth-dial").value;
      const raw = document.getElementById("auth-identifier").value.trim();
      const target = raw.includes("@") ? raw : dial + raw.replace(/\D/g, "");
      const route = target.startsWith("+86") ? "domestic" : "international";
      otpCooldown = 60;
      const btn = document.getElementById("btn-send-otp");
      btn.disabled = true;
      btn.textContent = "重新发送 (60s)";
      document.getElementById("auth-output").textContent = JSON.stringify({
        route: route,
        target: target,
        cooldown_seconds: 60
      });
    });

    document.getElementById("btn-login").addEventListener("click", () => {
      const channel = document.getElementById("auth-channel").value;
      const dial = document.getElementById("auth-dial").value;
      const rawId = document.getElementById("auth-identifier").value.trim() || "user";
      const id = channel === "verification_code" && !rawId.includes("@") ? dial + rawId.replace(/\D/g, "") : rawId;
      state.session = {
        auth_channel: channel,
        user_id: id,
        grants: { sync: false, ai: false, bot: false }
      };
      document.getElementById("session-badge").textContent = "已登录：" + id;
      document.getElementById("auth-output").textContent = "已登录：" + channel + " · " + id;
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      state.session = null;
      document.getElementById("session-badge").textContent = "本地工作空间";
      document.getElementById("auth-output").textContent = "已退出";
    });

    document.getElementById("btn-ai").addEventListener("click", () => {
      const select = document.getElementById("ai-model");
      const option = select.options[select.selectedIndex];
      const model = select.value;
      const multiplier = option.getAttribute("data-multiplier");
      const prompt = document.getElementById("ai-prompt").value.trim();
      const requestId = "req_" + Math.random().toString(36).slice(2, 10);
      document.getElementById("ai-output").textContent = JSON.stringify(
        {
          request_id: requestId,
          model: model,
          multiplier: multiplier,
          text: prompt.slice(0, 24)
        },
        null,
        2
      );
    });

    document.getElementById("btn-support-create").addEventListener("click", () => {
      const subject = document.getElementById("support-subject").value.trim();
      const message = document.getElementById("support-message").value.trim();
      const ticket = {
        ticket_id: "tkt_" + (state.tickets.length + 1),
        subject: subject,
        status: "open",
        messages: [{ sender_role: "user", content: message }]
      };
      state.tickets.push(ticket);
      document.getElementById("support-output").textContent = JSON.stringify(ticket, null, 2);
    });

    document.getElementById("btn-support-webhook").addEventListener("click", () => {
      const eventId = "evt_support_reply_001";
      state.processedEvents.add(eventId);
      document.getElementById("support-output").textContent = JSON.stringify(
        {
          event_id: eventId,
          status: "in_progress"
        },
        null,
        2
      );
    });

    document.getElementById("btn-mcp-run").addEventListener("click", () => {
      const action = document.getElementById("mcp-action").value;
      if (action === "preview_destructive_edit") {
        state.previewId = "prv_" + Math.random().toString(36).slice(2, 10);
      } else if (action === "confirm_destructive_edit") {
        state.historyDepth += 1;
      } else if (action === "undo" && state.historyDepth > 1) {
        state.historyDepth -= 1;
      }
      document.getElementById("mcp-output").textContent = JSON.stringify(
        {
          ok: true,
          action: action,
          preview_id: state.previewId,
          history_depth: state.historyDepth
        },
        null,
        2
      );
    });
  </script>
</body>
</html>
