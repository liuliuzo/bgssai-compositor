<!doctype html><html data-page-role="placeholder" lang="zh-CN"><meta charset="utf-8"><title>启动恢复检查原型</title>
<main><h1>开始创作</h1><p role="status" id="status">正在检查自动恢复…</p>
<button class="document-action" disabled>新建</button><button class="document-action" disabled>打开</button><button class="document-action" disabled>打开示例</button>
<p>启动时自动检查上次未保存的图层工程记录，检查完成后即可新建画布或打开本地项目。</p>
<button onclick="document.querySelectorAll('.document-action').forEach(button=>button.disabled=false);document.getElementById('status').textContent='自动恢复已就绪'">完成恢复检查</button></main></html>
